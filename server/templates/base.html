<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="google-site-verification" content="rH8_jqzUfRBHm4Aw7NabTbS15cSjYd0tImZ9v0Uy4dc" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>{% block title %}SeedFinder{% endblock %}</title>
	<meta name="description" content="{% block description %}Finds Minecraft Bedrock structures from the world seed and player position, such as villages, ancient cities, monuments and temples, through a free REST API.{% endblock %}" />
	<meta name="keywords" content="{% block keywords %}minecraft, bedrock, seed, seedfinder, structures, villages, village finder, ancient city, api{% endblock %}" />
	<link rel="icon" href="/favicon.ico" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link
		href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Pixelify+Sans:wght@400;500;600;700&display=swap"
		rel="stylesheet"
	/>
	<link rel="stylesheet" href="{{ url_for('static', filename='style/main.css') }}" />
	<script defer src="/_vercel/insights/script.js"></script>
	{% block head %}{% endblock %}
</head>
<body>
	<div class="grid-bg" aria-hidden="true"></div>
	<nav class="nav">
		<a class="nav-brand" href="/">
			<img
				src="https://github.com/zebedelu/SeedFinder/raw/main/server/logo/logo.ico"
				class="nav-logo"
				alt="SeedFinder logo"
			/>
			<span class="nav-title">SeedFinder</span>
		</a>
		<button class="nav-toggle" aria-label="Open menu" aria-expanded="false">
			<span></span><span></span><span></span>
		</button>
		<div class="nav-links" id="nav-links">
			<a class="nav-link {% if active == 'home' %}active{% endif %}" href="/">Home</a>
			<a class="nav-link {% if active == 'seedfinder' %}active{% endif %}" href="/seedfinder">SeedFinder</a>
			<a class="nav-link {% if active == 'docs' %}active{% endif %}" href="/seedfinder/documentation">Documentation</a>
			<a class="nav-link nav-github" href="https://github.com/zebedelu/SeedFinder" target="_blank" rel="noopener">GitHub</a>
		</div>
	</nav>

	<main class="page">
		{% block content %}{% endblock %}
	</main>

	<footer class="footer">
		<span>SeedFinder Project</span>
		<span>credits on GitHub
			<a href="https://github.com/zebedelu" target="_blank" rel="noopener">@zebedelu</a>
		</span>
	</footer>

	<script>
		(function () {
			const toggle = document.querySelector(".nav-toggle");
			const links = document.getElementById("nav-links");
			if (!toggle || !links) return;
			toggle.addEventListener("click", () => {
				const open = links.classList.toggle("open");
				toggle.setAttribute("aria-expanded", String(open));
			});
		})();
	</script>
	{% block scripts %}{% endblock %}
</body>
</html>
